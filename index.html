    <header>
        
        <div class="slider-holder">

            <div class="images" id="images">
                
                    <img src="assets/slider1.webp" class="slider-image" alt="">
                    <img src="assets/slider2.webp" class="slider-image" alt="">
                    <img src="assets/slider3.webp" class="slider-image" alt="">

            </div>

            <span class="slider-button right" onclick="next()"><strong><</strong></span>
            <span class="slider-button left" onclick="prev()"><strong>></strong></span>




        </div>





    </header>

    <main>
    


    </main>


    <footer>


    </footer>

    <script>
        let images = document.getElementById('images')
        let imageWidth = 1400
        let current = 0

        let maxImages = document.querySelectorAll(".slider-image").length
        

        function goToIndex(index){
            images.style.transform = `translateX(-${index * imageWidth}px)`

        }
        function next(){
            current = (current + 1) % maxImages;
            goToIndex(current)

           

            

        }
        function prev(){
            current = (current - 1 + maxImages)  % maxImages;
            goToIndex(current)

            

        }


    </script>
